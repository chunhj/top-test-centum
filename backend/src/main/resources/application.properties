spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# OSIV(spring.jpa.open-in-view, 기본값 true)를 끈다: 켜져 있으면 SSE처럼
# 오래 열려 있는 요청이 응답이 끝날 때까지 DB 커넥션을 붙잡아 둘 수 있어,
# SSE 연결 수가 늘수록 Hikari pool을 잠식해 다른 요청(투표)이 커넥션을
# 못 받게 되는 원인이 된다. 이 코드는 PollRepository 등에서 이미
# @EntityGraph로 필요한 연관관계를 즉시(eager) 로딩하도록 짜여 있어,
# OSIV(뷰 렌더링 중 지연 로딩 허용)에 의존하지 않으므로 꺼도 안전하다.
spring.jpa.open-in-view=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=${POPULAR_POLLS_CACHE_TTL:60s}
anonymous.voter.secret=${ANONYMOUS_VOTER_SECRET}
spring.flyway.placeholders.adminSeedPassword=${ADMIN_SEED_PASSWORD}
management.endpoints.web.exposure.include=health,metrics
