name: Test and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ADMIN_SEED_PASSWORD: ci-only-admin-password
      ANONYMOUS_VOTER_SECRET: ci-only-anonymous-voter-secret-32
      SPRING_DATASOURCE_PASSWORD: ci-only-postgres-password
      POSTGRES_CONCURRENCY_TEST: 'true'
      REDIS_INTEGRATION_TEST: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Backend tests
        working-directory: backend
        run: sh ./gradlew test --no-daemon

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Show repository IDs for OIDC trust
        run: echo "Owner ID=$GITHUB_REPOSITORY_OWNER_ID Repository ID=$GITHUB_REPOSITORY_ID"

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::503947799996:role/top-github-ssm-deploy
          aws-region: ap-northeast-2
          allowed-account-ids: '503947799996'

      - name: Deploy tested commit through SSM
        shell: bash
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids i-02a25c3abe17d7867 \
            --document-name top-deploy \
            --parameters "CommitSha=$GITHUB_SHA" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $command_id"
          for attempt in {1..240}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id i-02a25c3abe17d7867 \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id i-02a25c3abe17d7867
                exit 1 ;;
            esac
            sleep 5
          done
          if [ "$status" != Success ]; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id i-02a25c3abe17d7867 || true
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$command_id" --instance-id i-02a25c3abe17d7867 --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}'

      - name: Check public HTTP 200
        run: |
          curl --fail --silent --show-error --max-time 15 https://15.164.155.124/ >/dev/null
          curl --fail --silent --show-error --max-time 15 https://15.164.155.124/api/polls >/dev/null
