services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/top
      SPRING_DATASOURCE_USERNAME: top
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      ANONYMOUS_VOTER_SECRET: ${ANONYMOUS_VOTER_SECRET:?set ANONYMOUS_VOTER_SECRET in .env}
      # Secure voter cookie; browsers drop it over plain HTTP, so set false in .env when served over HTTP.
      ANONYMOUS_COOKIE_SECURE: ${ANONYMOUS_COOKIE_SECURE:-true}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: top
      POSTGRES_USER: top
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top -d top"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

volumes:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
